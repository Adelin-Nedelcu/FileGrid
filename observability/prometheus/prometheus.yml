global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: filegrid
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8080
        refresh_interval: 10s
