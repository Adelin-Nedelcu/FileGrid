resolver 127.0.0.11 valid=10s ipv6=off;

log_format filegrid '$remote_addr [$time_iso8601] request_id=$request_id "$request_method $uri $server_protocol" '
                    'status=$status bytes_in=$request_length bytes_out=$body_bytes_sent '
                    'duration=${request_time}s backend=$upstream_addr';

limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;

upstream filegrid_backend {
    zone filegrid_backend 64k;
    server backend:8080 resolve;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/access.log filegrid;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_body_timeout 120s;
    send_timeout 120s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /actuator {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://filegrid_backend;
    }

    location /api/ {
        proxy_pass http://filegrid_backend;
    }
}
